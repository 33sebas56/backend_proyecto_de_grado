server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/convenios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-me-development-secret-key-2026-minimum-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.open-in-view=false

# Storage provider
# local = guarda en disco local para pruebas locales
# supabase = guarda PDFs e imágenes en Supabase Storage para Render/despliegue
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.base-path=${APP_STORAGE_BASE_PATH:storage}

# Supabase Storage
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:convenios-documents}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.system-url=${APP_SYSTEM_URL:http://localhost:4200}
app.company-upload-path=${APP_COMPANY_UPLOAD_PATH:/api/public/company-upload}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@localhost}}
app.mail.register-code-expiration-minutes=${APP_MAIL_REGISTER_CODE_EXPIRATION_MINUTES:10}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=35MB

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}